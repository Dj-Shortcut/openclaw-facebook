app = "leaderbot-fb-image-gen"
primary_region = "ams"
kill_signal = "SIGTERM"
kill_timeout = 300

[build]
  dockerfile = "Dockerfile"

[deploy]
  # The immutable artifact marker selects its fail-closed schema check:
  # the bridge accepts stable 0016_expand and 0018_credit_checkout_reservation,
  # while the final runtime requires exactly 0018_credit_checkout_reservation.
  release_command = "timeout -k 30s 8m env LEADERBOT_PRODUCTION_MIGRATION_MODE=verify-artifact node dist/migrate-production.cjs"
  release_command_timeout = "10m"

[env]
  # Emergency rollback keeps the safety outbox lane disabled while payment
  # exposure is closed. The bright predecessor config remains separately
  # recorded for the exact settled-live identity.
  AI_ANSWER_FINALIZATION_DRAIN_ENABLED = "false"
  AI_ANSWER_QUOTA_PREFLIGHT_ENABLED = "false"
  APP_BASE_URL = "https://app.leaderbot.live"
  PUBLIC_BASE_URL = "https://pub-7e5beae089c4457a89cb65cf300daf75.r2.dev"
  BILLING_CUSTOMER_NOTIFICATION_KEY_ID = "test-customer-v1"
  BILLING_CUSTOMER_NOTIFICATION_WEBHOOK_URL = "https://app.leaderbot.live/api/internal/billing/notifications/customer"
  BILLING_NOTIFICATION_ORIGIN_ALLOWLIST = "https://app.leaderbot.live"
  BILLING_NOTIFICATION_PLANE_ENABLED = "true"
  BILLING_NOTIFICATION_RECEIVER_CUSTOMER_KEY_ID = "test-customer-v1"
  BILLING_NOTIFICATION_RECEIVER_OPERATOR_KEY_ID = "test-operator-v1"
  BILLING_NOTIFICATION_RECEIVER_PREFLIGHT_ACK = "true"
  BILLING_NOTIFICATION_RECEIVER_PUBLIC_ORIGIN = "https://app.leaderbot.live"
  BILLING_NOTIFICATION_RECEIVER_SOURCE_ID = "leaderbot-fly-test-v1"
  BILLING_NOTIFICATION_SOURCE_ID = "leaderbot-fly-test-v1"
  BILLING_OPERATOR_NOTIFICATION_KEY_ID = "test-operator-v1"
  BILLING_OPERATOR_NOTIFICATION_WEBHOOK_URL = "https://app.leaderbot.live/api/internal/billing/notifications/operator"
  BILLING_SUPPORT_EMAIL = "privacy@leaderbot.live"
  FB_PAGE_CONNECT_CONFIG_ID = "2097873054148678"
  MESSENGER_GLOBAL_DAILY_SPEND_CAP_USD = "5.00"
  MESSENGER_GLOBAL_MONTHLY_SPEND_CAP_USD = "25.00"
  MESSENGER_FREE_DAILY_LIMIT = "5"
  MESSENGER_FREE_MONTHLY_LIMIT = "20"
  MESSENGER_GENERATION_QUEUE_WRITE_VERSION = "v1"
  MESSENGER_IMAGE_QUOTA_TIME_ZONE = "Europe/Brussels"
  MESSENGER_USER_DAILY_SPEND_CAP_USD = "2.00"
  MESSENGER_PAID_CREDITS_ENABLED = "false"
  MOLLIE_CREDIT_CHECKOUT_ENABLED = "false"
  MOLLIE_CREDIT_WORKSPACE_ID = "1"
  MESSENGER_PAID_IMAGE_PROVIDER_MAX_COST_USD = "1.00"
  MOLLIE_CREDIT_TEST_CHANNEL_CONNECTION_ID = ""
  MOLLIE_CREDIT_TEST_BINDING_EPOCH = ""
  MOLLIE_CREDIT_TEST_PRIVACY_EPOCH = ""
  MOLLIE_CREDIT_TEST_USER_KEY_HASH = ""
  CREDIT_CHECKOUT_HMAC_ACTIVE_KEY_ID = "k1"
  MOLLIE_ACCOUNTING_IMPORT_ENABLED = "false"
  MOLLIE_BILLING_ENABLED = "false"
  MOLLIE_BILLING_DRAIN_ENABLED = "true"
  MOLLIE_BILLING_PREFLIGHT_ENABLED = "false"
  MOLLIE_BILLING_SCHEDULER_MODE = "pilot_pin"
  MOLLIE_BILLING_WORKER_WORKSPACE_ID = "1"
  MOLLIE_CREDENTIAL_GENERATION_ID = "test-fly-v1"
  MOLLIE_ENTITLEMENT_ENFORCEMENT_ENABLED = "false"
  MOLLIE_LIVE_BILLING_ENABLED = "false"
  MOLLIE_MODE = "test"
  MOLLIE_PAYMENT_WEBHOOK_URL = "https://app.leaderbot.live/api/webhooks/mollie/payments"
  MOLLIE_RECONCILIATION_ENABLED = "true"
  NODE_ENV = "production"
  OPENAI_IMAGE_MAX_RETRIES = "0"
  PORT = "8080"
  STORAGE_ALLOW_LEGACY_KEYS = "true"

[processes]
  app = "env MESSENGER_GENERATION_QUEUE_ENABLED=1 MESSENGER_GENERATION_INLINE_FALLBACK=0 node dist/index.cjs"
  worker = "env MESSENGER_GENERATION_QUEUE_ENABLED=1 MESSENGER_GENERATION_WORKER_ONLY=1 node dist/index.cjs"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "45s"
    method = "GET"
    path = "/readyz"
