name: Enable image-gen Test payment processing

on:
  workflow_dispatch:
    inputs:
      operator_image:
        description: Exact reviewed immutable runtime image containing the operator CLI
        required: true
        type: string
      operator_source_sha:
        description: Exact reviewed main source SHA of that immutable operator image
        required: true
        type: string
      request_id:
        description: One UUID for this audited enable request; never change it after ambiguity
        required: true
        type: string
      expected_epoch:
        description: Current disabled execution-control epoch for owner workspace 1 in Test Mode
        required: true
        default: "1"
        type: string

permissions:
  actions: read
  attestations: read
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  FLYCTL_VERSION: 0.4.85

concurrency:
  group: production-deploy-image-gen
  cancel-in-progress: false

jobs:
  enable:
    name: Enable only the audited owner Test processing lanes
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Require protected main
        run: test "$GITHUB_REF" = "refs/heads/main"

      - name: Check out exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm

      - name: Install and validate reviewed verification code
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          npm ci
          npm run production:validate

      - name: Install exact verified flyctl
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_OS" = "Linux"
          test "$RUNNER_ARCH" = "X64"
          install_root="$(mktemp -d "$RUNNER_TEMP/leaderbot-flyctl.XXXXXX")"
          archive="$install_root/flyctl_0.4.85_Linux_x86_64.tar.gz"
          extract_dir="$install_root/extract"
          bin_dir="$install_root/bin"
          install -d -m 0700 "$extract_dir" "$bin_dir"
          curl --fail --show-error --silent --location \
            --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --retry 3 --retry-all-errors \
            --output "$archive" \
            "https://github.com/superfly/flyctl/releases/download/v0.4.85/flyctl_0.4.85_Linux_x86_64.tar.gz"
          printf '%s  %s\n' \
            "c3b5ed05319adf8a265d68171758ea7b37bd340c5c3dc4e09e17fb6344b8ff90" \
            "$archive" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$extract_dir" flyctl
          test -f "$extract_dir/flyctl"
          test ! -L "$extract_dir/flyctl"
          install -m 0755 "$extract_dir/flyctl" "$bin_dir/flyctl"
          ln -s flyctl "$bin_dir/fly"
          version_output="$("$bin_dir/flyctl" version)"
          [[ "$version_output" =~ ^flyctl\ v0\.4\.85([[:space:]]|$) ]]
          printf '%s\n' "$bin_dir" >> "$GITHUB_PATH"

      - name: Run the exact attested Test payment operator once
        timeout-minutes: 15
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FLY_API_TOKEN: ${{ secrets.FLY_IMAGE_GEN_DEPLOY_TOKEN }}
          OPERATOR_IMAGE: ${{ inputs.operator_image }}
          OPERATOR_SOURCE_SHA: ${{ inputs.operator_source_sha }}
          OPERATOR_REQUEST_ID: ${{ inputs.request_id }}
          OPERATOR_EXPECTED_EPOCH: ${{ inputs.expected_epoch }}
        run: |
          set -euo pipefail
          node scripts/image-gen-test-payment-operator.mjs

      - name: Retain metadata-only operator evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-payment-operator-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/test-payment-operator-evidence.json
          if-no-files-found: warn
          retention-days: 7
