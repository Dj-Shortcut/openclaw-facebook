name: Repair staged image-gen database hostname

on:
  workflow_dispatch:
    inputs:
      exclusive_secret_window:
        description: "Operator confirms no direct Fly/API secret changes during this repair"
        required: true
        type: boolean
        default: false

permissions:
  actions: read
  attestations: read
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  FLYCTL_VERSION: 0.4.85

concurrency:
  group: production-deploy-image-gen
  cancel-in-progress: false

jobs:
  repair:
    name: Preserve the staged principal and repair only its database hostname
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Check out exact protected source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"

      - name: Install exact verified flyctl
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_OS" = "Linux"
          test "$RUNNER_ARCH" = "X64"
          install_root="$(mktemp -d "$RUNNER_TEMP/leaderbot-flyctl.XXXXXX")"
          archive="$install_root/flyctl_0.4.85_Linux_x86_64.tar.gz"
          extract_dir="$install_root/extract"
          bin_dir="$install_root/bin"
          install -d -m 0700 "$extract_dir" "$bin_dir"
          curl --fail --show-error --silent --location \
            --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --retry 3 --retry-all-errors \
            --output "$archive" \
            "https://github.com/superfly/flyctl/releases/download/v0.4.85/flyctl_0.4.85_Linux_x86_64.tar.gz"
          printf '%s  %s\n' \
            "c3b5ed05319adf8a265d68171758ea7b37bd340c5c3dc4e09e17fb6344b8ff90" \
            "$archive" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$extract_dir" flyctl
          test -f "$extract_dir/flyctl"
          test ! -L "$extract_dir/flyctl"
          install -m 0755 "$extract_dir/flyctl" "$bin_dir/flyctl"
          ln -s flyctl "$bin_dir/fly"
          version_output="$("$bin_dir/flyctl" version)"
          [[ "$version_output" =~ ^flyctl\ v0\.4\.85([[:space:]]|$) ]]
          printf '%s\n' "$bin_dir" >> "$GITHUB_PATH"

      - name: Verify the source and perform the bounded hostname repair
        env:
          GH_TOKEN: ${{ github.token }}
          FLY_API_TOKEN: ${{ secrets.FLY_IMAGE_GEN_DEPLOY_TOKEN }}
          FLY_DATABASE_MIGRATION_TOKEN: ${{ secrets.FLY_DATABASE_MIGRATION_TOKEN }}
          EXCLUSIVE_SECRET_WINDOW: ${{ inputs.exclusive_secret_window }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -n "$GH_TOKEN"
          test -n "$FLY_API_TOKEN"
          test -n "$FLY_DATABASE_MIGRATION_TOKEN"
          test "$EXCLUSIVE_SECRET_WINDOW" = "true"
          flyctl auth docker > /dev/null
          trap 'docker logout registry.fly.io > /dev/null 2>&1 || true' EXIT
          node scripts/repair-image-gen-runtime-database-host.mjs --stage > "$RUNNER_TEMP/runtime-database-host.json"

      - name: Retain metadata-only hostname repair evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-gen-database-host-repair-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/runtime-database-host.json
          if-no-files-found: error
          retention-days: 30
