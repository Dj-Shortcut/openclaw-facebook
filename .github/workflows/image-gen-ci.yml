name: Image Gen CI

on:
  pull_request:
    paths:
      - "apps/image-gen/**"
      - ".github/workflows/image-gen-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/image-gen/**"
      - ".github/workflows/image-gen-ci.yml"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4.11
        env:
          MYSQL_ROOT_PASSWORD: testroot
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -ptestroot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
        ports:
          - 3306:3306
      redis:
        image: redis:7.4-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
        ports:
          - 6379:6379
    defaults:
      run:
        working-directory: apps/image-gen

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/image-gen/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Lint changed server code
        env:
          LINT_BASE_REF: origin/main
        run: pnpm run lint:server:release

      - name: Check changed server formatting
        env:
          LINT_BASE_REF: origin/main
        run: pnpm run format:server:release

      - name: Check MySQL identifier contract
        run: pnpm run db:check-identifiers

      - name: Type-check production code
        run: pnpm run check

      - name: Test
        run: pnpm run test

      - name: Test distributed Redis spend admission
        env:
          REDIS_URL: redis://127.0.0.1:6379/15
          RUN_REDIS_INTEGRATION: "1"
        run: ./node_modules/.bin/vitest run server/generationGuard.redis.test.ts --no-file-parallelism

      - name: Test Redis generation privacy fences
        env:
          REDIS_URL: redis://127.0.0.1:6379/14
          RUN_REDIS_INTEGRATION: "1"
        run: ./node_modules/.bin/vitest run server/messengerGenerationQueue.redis.test.ts server/messengerGenerationCompletion.redis.test.ts --no-file-parallelism

      - name: Rehearse MySQL 0014 to 0015 upgrade and recovery
        env:
          MYSQL_REHEARSAL_URL: mysql://root:testroot@127.0.0.1:3306/mysql
        run: pnpm run db:rehearse-0015

      - name: Build
        run: pnpm run build

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high
