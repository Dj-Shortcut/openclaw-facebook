name: Recover an incomplete production deployment

on:
  workflow_run:
    workflows: ["Deploy production"]
    types: [completed]

permissions:
  actions: read
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  inspect:
    name: Find a completed run that still has a rollback plan
    if: github.event.workflow_run.event == 'workflow_dispatch' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion != 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      needed: ${{ steps.plan.outputs.needed }}
      run_id: ${{ steps.plan.outputs.run_id }}
      run_attempt: ${{ steps.plan.outputs.run_attempt }}
      target: ${{ steps.plan.outputs.target }}
    steps:
      - name: Select at most one exact durable rollback plan
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$SOURCE_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          run="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/attempts/$SOURCE_RUN_ATTEMPT")"
          jq -e --argjson runId "$SOURCE_RUN_ID" --argjson runAttempt "$SOURCE_RUN_ATTEMPT" '.id==$runId and .run_attempt==$runAttempt and .status=="completed" and (.conclusion|IN("failure","cancelled","timed_out","action_required","stale","startup_failure")) and .head_branch=="main" and .event=="workflow_dispatch" and .path==".github/workflows/deploy-production.yml"' <<<"$run" > /dev/null
          gateway="gateway-rollback-${SOURCE_RUN_ID}-${SOURCE_RUN_ATTEMPT}"
          image_gen="image-gen-rollback-${SOURCE_RUN_ID}-${SOURCE_RUN_ATTEMPT}"
          storage_proxy="storage-proxy-rollback-${SOURCE_RUN_ID}-${SOURCE_RUN_ATTEMPT}"
          names="$(jq -cn --arg gateway "$gateway" --arg imageGen "$image_gen" --arg storageProxy "$storage_proxy" '[$gateway,$imageGen,$storageProxy]')"
          artifacts="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100")"
          selected="$(jq -cr --argjson names "$names" '[.artifacts[] | select(.expired==false and (.name as $name | $names | index($name) != null))] | if length==0 then null elif length==1 then .[0] else error("multiple production rollback plans") end' <<<"$artifacts")"
          if test "$selected" = "null"; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          artifact_name="$(jq -er '.name' <<<"$selected")"
          suffix="-rollback-${SOURCE_RUN_ID}-${SOURCE_RUN_ATTEMPT}"
          target="${artifact_name%"$suffix"}"
          [[ "$target" =~ ^(gateway|image-gen|storage-proxy)$ ]]
          jobs="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/attempts/$SOURCE_RUN_ATTEMPT/jobs?per_page=100")"
          queue_name="Queue exact ${target} recovery after failed deploy"
          queue_result="$(jq -er --arg name "$queue_name" '[.jobs[] | select(.name==$name)] | if length==0 then "missing" elif length==1 then (.[0].conclusion // "missing") else error("duplicate recovery queue jobs") end' <<<"$jobs")"
          if test "$queue_result" = "success"; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "needed=true"
            echo "run_id=$SOURCE_RUN_ID"
            echo "run_attempt=$SOURCE_RUN_ATTEMPT"
            echo "target=$target"
          } >> "$GITHUB_OUTPUT"

  dispatch-recovery:
    name: Dispatch exact protected rollback after completion
    needs: inspect
    if: needs.inspect.outputs.needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch exact completed recovery
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVERY_RUN_ID: ${{ needs.inspect.outputs.run_id }}
          RECOVERY_RUN_ATTEMPT: ${{ needs.inspect.outputs.run_attempt }}
          RECOVERY_TARGET: ${{ needs.inspect.outputs.target }}
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          [[ "$RECOVERY_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$RECOVERY_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          [[ "$RECOVERY_TARGET" =~ ^(gateway|image-gen|storage-proxy)$ ]]
          run="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$RECOVERY_RUN_ID/attempts/$RECOVERY_RUN_ATTEMPT")"
          jq -e --argjson runId "$RECOVERY_RUN_ID" --argjson runAttempt "$RECOVERY_RUN_ATTEMPT" '.id==$runId and .run_attempt==$runAttempt and .status=="completed" and (.conclusion|IN("failure","cancelled","timed_out","action_required","stale","startup_failure")) and .head_branch=="main" and .event=="workflow_dispatch" and .path==".github/workflows/deploy-production.yml" and (.head_sha|test("^[a-f0-9]{40}$"))' <<<"$run" > /dev/null
          artifact_name="${RECOVERY_TARGET}-rollback-${RECOVERY_RUN_ID}-${RECOVERY_RUN_ATTEMPT}"
          artifacts="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$RECOVERY_RUN_ID/artifacts?per_page=100")"
          jq -e --arg name "$artifact_name" '[.artifacts[] | select(.expired==false and .name==$name)] | length==1' <<<"$artifacts" > /dev/null
          payload="$(jq -cn \
            --arg runId "$RECOVERY_RUN_ID" \
            --arg runAttempt "$RECOVERY_RUN_ATTEMPT" \
            --arg target "$RECOVERY_TARGET" \
            '{ref:"main",inputs:{recovery_run_id:$runId,recovery_run_attempt:$runAttempt,target:$target}}')"
          gh api --method POST \
            "/repos/$GITHUB_REPOSITORY/actions/workflows/reconcile-production-deployment.yml/dispatches" \
            --input - <<<"$payload"
