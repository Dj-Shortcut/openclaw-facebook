name: image-gen migration smoke

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: image-gen-migration-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify migration changes
    runs-on: ubuntu-latest
    outputs:
      migration: ${{ steps.classify.outputs.migration }}
    steps:
      - name: Checkout history for exact change classification
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changed paths
        id: classify
        env:
          CI_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/classify-ci-changes.mjs

  migrate:
    name: Drizzle migration smoke
    needs: changes
    if: needs.changes.outputs.migration == 'true'
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4.11@sha256:1d6b6a8fcee8ff758ff151d017f5203cd06792a0e698f0a593c9dfcb14609cf0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test_image_gen
        options: >-
          --health-cmd "mysqladmin ping -h127.0.0.1 -uroot -proot --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 3306:3306

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Prepare package manager
        run: |
          corepack enable
          corepack prepare pnpm@10.28.1 --activate

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: apps/image-gen/pnpm-lock.yaml

      - name: Install dependencies
        run: |
          corepack pnpm --dir apps/image-gen install --frozen-lockfile

      - name: Rehearse and apply the final production credit schema
        working-directory: apps/image-gen
        env:
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/test_image_gen
          MYSQL_REHEARSAL_URL: mysql://root:root@127.0.0.1:3306/mysql
        run: |
          pnpm run db:rehearse-0015
          pnpm run db:rehearse-0016
          pnpm run db:rehearse-0017
          pnpm run db:rehearse-0018
          pnpm run build:docker
          pnpm run db:test-production-migrator
          pnpm run db:generate-production-contract
          git diff --exit-code -- drizzle/production-schema-contract.json
          pnpm run db:migrate:test-bootstrap

      - name: Verify migrated schema and history are exact and idempotent
        working-directory: apps/image-gen
        env:
          LEADERBOT_PRODUCTION_MIGRATION_MODE: verify-credit-wallet
        run: |
          set -euo pipefail
          cleanup() {
            mysql -h127.0.0.1 -uroot -proot \
              -e "DROP USER IF EXISTS 'runtime_credit_smoke'@'%'"
          }
          trap cleanup EXIT
          cleanup
          mysql -h127.0.0.1 -uroot -proot \
            -e "CREATE USER 'runtime_credit_smoke'@'%' IDENTIFIED BY 'runtime_credit_smoke'"
          CREDIT_RUNTIME_ADMIN_URL=mysql://root:root@127.0.0.1:3306/test_image_gen \
            CREDIT_RUNTIME_DATABASE=test_image_gen \
            pnpm exec node --input-type=module <<'NODE'
          import mysql from "mysql2/promise";
          import {
            creditWalletRoutineNames,
            productionRuntimeWritableTableNames,
          } from "./scripts/production-schema-contract.mjs";

          const connection = await mysql.createConnection(
            process.env.CREDIT_RUNTIME_ADMIN_URL
          );
          const database = `\`${process.env.CREDIT_RUNTIME_DATABASE}\``;
          const account = "'runtime_credit_smoke'@'%'";
          try {
            await connection.query(`GRANT SELECT ON ${database}.* TO ${account}`);
            for (const table of productionRuntimeWritableTableNames) {
              await connection.query(
                `GRANT INSERT, UPDATE, DELETE ON ${database}.\`${table}\` TO ${account}`
              );
            }
            for (const routine of creditWalletRoutineNames) {
              await connection.query(
                `GRANT EXECUTE ON PROCEDURE ${database}.\`${routine}\` TO ${account}`
              );
            }
          } finally {
            await connection.end();
          }
          NODE
          DATABASE_URL=mysql://runtime_credit_smoke:runtime_credit_smoke@127.0.0.1:3306/test_image_gen \
            node scripts/run-production-migrations.mjs

      - name: Exercise credit-provisioner retirement against MySQL 8.4
        working-directory: apps/image-gen
        env:
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/test_image_gen
          RUN_MYSQL_INTEGRATION: "1"
        run: pnpm exec vitest run server/creditProvisionerRetirement.mysql.test.ts

      - name: Apply and verify from the exact production container
        working-directory: apps/image-gen
        run: |
          mysql -h127.0.0.1 -uroot -proot -e "CREATE DATABASE test_image_gen_container CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci"
          image="leaderbot-image-gen-migration:${GITHUB_SHA}"
          docker build --build-arg SOURCE_REVISION="$GITHUB_SHA" --tag "$image" .
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image")" = "$GITHUB_SHA"
          test "$(docker image inspect --format '{{ index .Config.Labels "io.leaderbot.schema.minimum" }}' "$image")" = "0018_credit_checkout_reservation"
          test "$(docker image inspect --format '{{ index .Config.Labels "io.leaderbot.schema.maximum" }}' "$image")" = "0018_credit_checkout_reservation"
          docker run --rm --network host \
            --env DATABASE_URL=mysql://root:root@127.0.0.1:3306/test_image_gen_container \
            --env NODE_ENV=test \
            --env LEADERBOT_ALLOW_TEST_SCHEMA_BOOTSTRAP=1 \
            --env LEADERBOT_PRODUCTION_MIGRATION_MODE=apply-empty-credit-wallet-bootstrap \
            "$image" node dist/migrate-production.cjs
          cleanup() {
            mysql -h127.0.0.1 -uroot -proot \
              -e "DROP USER IF EXISTS 'runtime_credit_container'@'%'"
          }
          trap cleanup EXIT
          cleanup
          mysql -h127.0.0.1 -uroot -proot \
            -e "CREATE USER 'runtime_credit_container'@'%' IDENTIFIED BY 'runtime_credit_container'"
          CREDIT_RUNTIME_ADMIN_URL=mysql://root:root@127.0.0.1:3306/test_image_gen_container \
            CREDIT_RUNTIME_DATABASE=test_image_gen_container \
            pnpm exec node --input-type=module <<'NODE'
          import mysql from "mysql2/promise";
          import {
            creditWalletRoutineNames,
            productionRuntimeWritableTableNames,
          } from "./scripts/production-schema-contract.mjs";

          const connection = await mysql.createConnection(
            process.env.CREDIT_RUNTIME_ADMIN_URL
          );
          const database = `\`${process.env.CREDIT_RUNTIME_DATABASE}\``;
          const account = "'runtime_credit_container'@'%'";
          try {
            await connection.query(`GRANT SELECT ON ${database}.* TO ${account}`);
            for (const table of productionRuntimeWritableTableNames) {
              await connection.query(
                `GRANT INSERT, UPDATE, DELETE ON ${database}.\`${table}\` TO ${account}`
              );
            }
            for (const routine of creditWalletRoutineNames) {
              await connection.query(
                `GRANT EXECUTE ON PROCEDURE ${database}.\`${routine}\` TO ${account}`
              );
            }
          } finally {
            await connection.end();
          }
          NODE
          docker run --rm --network host \
            --env DATABASE_URL=mysql://runtime_credit_container:runtime_credit_container@127.0.0.1:3306/test_image_gen_container \
            --env LEADERBOT_PRODUCTION_MIGRATION_MODE=verify-credit-wallet \
            "$image" node dist/migrate-production.cjs

      - name: Verify dailyQuota composite index exists
        run: |
          index_contract=$(
            mysql -h127.0.0.1 -uroot -proot test_image_gen -Nse "SELECT
              COUNT(*) FROM INFORMATION_SCHEMA.STATISTICS
              WHERE TABLE_SCHEMA = DATABASE()
                AND TABLE_NAME = 'dailyQuota'
                AND INDEX_NAME = 'dailyQuota_userId_date_unique'
                AND NON_UNIQUE = 0
                AND ((SEQ_IN_INDEX = 1 AND COLUMN_NAME = 'userId')
                  OR (SEQ_IN_INDEX = 2 AND COLUMN_NAME = 'date'));"
          )

          column_count=$(
            mysql -h127.0.0.1 -uroot -proot test_image_gen -Nse "SELECT
              COUNT(*)
              FROM INFORMATION_SCHEMA.STATISTICS
              WHERE TABLE_SCHEMA = DATABASE()
                AND TABLE_NAME = 'dailyQuota'
                AND INDEX_NAME = 'dailyQuota_userId_date_unique';"
          )

          if [ "$index_contract" != "2" ] || [ "$column_count" != "2" ]; then
            echo 'Expected unique index dailyQuota_userId_date_unique(userId, date) missing or malformed';
            exit 1;
          fi

          legacy_index_count=$(
            mysql -h127.0.0.1 -uroot -proot test_image_gen -Nse "SELECT
              COUNT(*)
              FROM INFORMATION_SCHEMA.STATISTICS
              WHERE TABLE_SCHEMA = DATABASE()
                AND TABLE_NAME = 'dailyQuota'
                AND INDEX_NAME = 'dailyQuota_userId_unique';"
          )

          if [ "$legacy_index_count" != "0" ]; then
            echo 'Legacy unique index dailyQuota_userId_unique must be absent';
            exit 1;
          fi
