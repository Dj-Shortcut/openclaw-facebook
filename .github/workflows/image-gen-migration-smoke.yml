name: image-gen migration smoke

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "apps/image-gen/drizzle/**"
      - "apps/image-gen/drizzle.config.ts"
      - "apps/image-gen/scripts/migrate-production.mjs"
      - "apps/image-gen/scripts/test-production-migrator.mjs"
      - "apps/image-gen/scripts/generate-production-schema-contract.mjs"
      - "apps/image-gen/scripts/production-schema-contract.mjs"
      - "apps/image-gen/drizzle/production-schema-contract.json"
      - "apps/image-gen/package.json"
      - "apps/image-gen/pnpm-lock.yaml"
      - "apps/image-gen/server/_core/billing/portalHandoffRecovery.ts"
      - "apps/image-gen/server/_core/messengerInboundActivity.ts"
      - "apps/image-gen/server/portalHandoff.mysql.test.ts"
      - ".github/workflows/image-gen-migration-smoke.yml"
  workflow_dispatch:

concurrency:
  group: image-gen-migration-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  migrate:
    name: Drizzle migration smoke
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4.11@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test_image_gen
        options: >-
          --health-cmd "mysqladmin ping -h127.0.0.1 -uroot -proot --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 3306:3306

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Prepare package manager
        run: |
          corepack enable
          corepack prepare pnpm@10.28.1 --activate

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: apps/image-gen/pnpm-lock.yaml

      - name: Install dependencies
        run: |
          corepack pnpm --dir apps/image-gen install --frozen-lockfile

      - name: Verify pinned MySQL version
        run: |
          test "$(mysql -h127.0.0.1 -uroot -proot -Nse 'SELECT VERSION()')" = "8.4.11"

      - name: Verify schema contract is tracked
        working-directory: apps/image-gen
        run: git ls-files --error-unmatch drizzle/production-schema-contract.json

      - name: Check MySQL identifier contract
        working-directory: apps/image-gen
        run: |
          pnpm run db:check-identifiers

      - name: Regenerate exact MySQL schema contract
        working-directory: apps/image-gen
        env:
          MYSQL_REHEARSAL_URL: mysql://root:root@127.0.0.1:3306/mysql
        run: pnpm run db:generate-production-contract

      - name: Upload generated MySQL schema contract
        if: ${{ always() }}
        uses: actions/upload-artifact@v5
        with:
          name: production-schema-contract-migration-smoke
          path: apps/image-gen/drizzle/production-schema-contract.json
          if-no-files-found: error

      - name: Verify generated MySQL schema contract is committed
        working-directory: apps/image-gen
        run: |
          git diff --exit-code -- drizzle/production-schema-contract.json

      - name: Run production migration entrypoint
        working-directory: apps/image-gen
        env:
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/test_image_gen
        run: |
          pnpm run db:migrate

      - name: Verify migration singleton, hashes and partial-state refusal
        working-directory: apps/image-gen
        env:
          MYSQL_REHEARSAL_URL: mysql://root:root@127.0.0.1:3306/mysql
        run: |
          pnpm run db:test-production-migrator

      - name: Verify dailyQuota composite index exists
        run: |
          index_contract=$(
            mysql -h127.0.0.1 -uroot -proot test_image_gen -Nse "SELECT
              COUNT(*) FROM INFORMATION_SCHEMA.STATISTICS
              WHERE TABLE_SCHEMA = DATABASE()
                AND TABLE_NAME = 'dailyQuota'
                AND INDEX_NAME = 'dailyQuota_userId_date_unique'
                AND NON_UNIQUE = 0
                AND ((SEQ_IN_INDEX = 1 AND COLUMN_NAME = 'userId')
                  OR (SEQ_IN_INDEX = 2 AND COLUMN_NAME = 'date'));"
          )

          column_count=$(
            mysql -h127.0.0.1 -uroot -proot test_image_gen -Nse "SELECT
              COUNT(*)
              FROM INFORMATION_SCHEMA.STATISTICS
              WHERE TABLE_SCHEMA = DATABASE()
                AND TABLE_NAME = 'dailyQuota'
                AND INDEX_NAME = 'dailyQuota_userId_date_unique';"
          )

          if [ "$index_contract" != "2" ] || [ "$column_count" != "2" ]; then
            echo 'Expected unique index dailyQuota_userId_date_unique(userId, date) missing or malformed';
            exit 1;
          fi

          legacy_index_count=$(
            mysql -h127.0.0.1 -uroot -proot test_image_gen -Nse "SELECT
              COUNT(*)
              FROM INFORMATION_SCHEMA.STATISTICS
              WHERE TABLE_SCHEMA = DATABASE()
                AND TABLE_NAME = 'dailyQuota'
                AND INDEX_NAME = 'dailyQuota_userId_unique';"
          )

          if [ "$legacy_index_count" != "0" ]; then
            echo 'Legacy unique index dailyQuota_userId_unique must be absent';
            exit 1;
          fi

      - name: Verify portal handoff MySQL concurrency
        working-directory: apps/image-gen
        env:
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/test_image_gen
          RUN_MYSQL_INTEGRATION: "1"
        run: |
          ./node_modules/.bin/vitest run server/portalHandoff.mysql.test.ts

      - name: Rehearse portal handoff schema upgrade with existing rows
        run: |
          mysql -h127.0.0.1 -uroot -proot test_image_gen <<'SQL'
          ALTER TABLE portalHandoffTokens
            DROP INDEX portalHandoffTokens_delivery_key_hash_unique;
          ALTER TABLE portalHandoffTokens
            DROP COLUMN deliveryIdempotencyKeyHash;
          INSERT INTO portalHandoffTokens (
            workspaceId,
            tokenHash,
            messengerSenderUserKey,
            facebookPageId,
            purpose,
            status,
            expiresAt,
            createdByUserId
          ) VALUES (
            900001,
            CONCAT('sha256:', REPEAT('d', 64)),
            REPEAT('e', 64),
            'migration-rehearsal-page',
            'workspace_onboarding',
            'pending',
            DATE_ADD(NOW(), INTERVAL 1 DAY),
            NULL
          );
          SQL

          sed 's/--> statement-breakpoint/\n/g' \
            apps/image-gen/drizzle/0014_portal_handoff_delivery_idempotency.sql \
            | mysql -h127.0.0.1 -uroot -proot test_image_gen

          existing_rows=$(mysql -h127.0.0.1 -uroot -proot test_image_gen -Nse "SELECT COUNT(*) FROM portalHandoffTokens WHERE workspaceId = 900001 AND deliveryIdempotencyKeyHash IS NULL;")
          index_columns=$(mysql -h127.0.0.1 -uroot -proot test_image_gen -Nse "SELECT COUNT(*) FROM INFORMATION_SCHEMA.STATISTICS WHERE TABLE_SCHEMA = DATABASE() AND TABLE_NAME = 'portalHandoffTokens' AND INDEX_NAME = 'portalHandoffTokens_delivery_key_hash_unique' AND NON_UNIQUE = 0 AND COLUMN_NAME = 'deliveryIdempotencyKeyHash';")

          if [ "$existing_rows" != "1" ] || [ "$index_columns" != "1" ]; then
            echo 'Migration 0014 did not preserve existing rows or restore the unique delivery index';
            exit 1;
          fi
