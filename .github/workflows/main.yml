name: Production contract CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Validate package-manager boundaries
        run: node scripts/check-package-manager-contract.mjs

      - name: Validate product boundaries
        run: npm run check:product-boundaries

      - name: Validate gateway deployment safety
        run: npm run gateway:deployment-safety

      - name: Validate production deployment contract
        run: npm run production:validate

      - name: Install dependencies
        run: npm ci

      - name: Test production contracts
        run: npm run test:production-contracts
