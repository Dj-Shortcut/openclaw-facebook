name: Publish Plugin to ClawHub

on:
  pull_request:
    paths:
      - ".github/workflows/clawhub-plugin-publish.yml"
      - "package.json"
      - "package-lock.json"
      - "openclaw.plugin.json"
      - "README.md"
      - "docs/clawhub-listing.md"
      - "docs/clawhub.md"
      - "docs/facebook-complete-tutorial.md"
      - "docs/openclaw-update.md"
      - "docs/operator-prompt-routing.md"
      - "docs/setup.md"
      - "examples/**"
      - "scripts/run-vitest.mjs"
      - "scripts/update-openclaw.mjs"
      - "scripts/update-openclaw.test.mjs"
      - "scripts/validate-openclaw-runtime.mjs"
      - "scripts/validate-release-versions.mjs"
      - "src/**"
      - "*.ts"
      - "tsconfig.json"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a real ClawHub release. Leave false for dry-run.
        type: boolean
        required: true
        default: false
  push:
    branches: [main]
    paths:
      - ".github/workflows/clawhub-plugin-publish.yml"
      - "package.json"
      - "package-lock.json"
      - "openclaw.plugin.json"
      - "README.md"
      - "docs/clawhub-listing.md"
      - "docs/clawhub.md"
      - "docs/facebook-complete-tutorial.md"
      - "docs/openclaw-update.md"
      - "docs/operator-prompt-routing.md"
      - "docs/setup.md"
      - "examples/**"
      - "scripts/run-vitest.mjs"
      - "scripts/update-openclaw.mjs"
      - "scripts/update-openclaw.test.mjs"
      - "scripts/validate-openclaw-runtime.mjs"
      - "scripts/validate-release-versions.mjs"
      - "src/**"
      - "*.ts"
      - "tsconfig.json"
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  package-artifact:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Validate OpenClaw runtime contract
        run: npm run openclaw:validate

      - name: Test
        run: npm run test:plugin
        env:
          TEST_MESSENGER_REDIS_URL: redis://127.0.0.1:6379

      - name: Audit plugin dependencies
        run: npm audit --audit-level=moderate

      - name: Dry-run npm pack
        run: npm run pack:dry

      - name: Create npm tarball
        id: pack
        run: |
          npm pack
          tarball="$(find . -maxdepth 1 -name 'dj-shortcut-facebook-*.tgz' -print -quit)"
          test -n "$tarball"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          echo "tarball_name=${tarball#./}" >> "$GITHUB_OUTPUT"

      - name: Validate tarball contents
        run: |
          tarball="${{ steps.pack.outputs.tarball }}"
          tar -tzf "$tarball" > /tmp/openclaw-facebook-tarball-files.txt
          grep -Fx "package/dist/index.js" /tmp/openclaw-facebook-tarball-files.txt
          grep -Fx "package/dist/setup-entry.js" /tmp/openclaw-facebook-tarball-files.txt
          grep -Fx "package/openclaw.plugin.json" /tmp/openclaw-facebook-tarball-files.txt
          grep -Fx "package/package.json" /tmp/openclaw-facebook-tarball-files.txt
          grep -Fx "package/README.md" /tmp/openclaw-facebook-tarball-files.txt
          grep -Fx "package/docs/clawhub-listing.md" /tmp/openclaw-facebook-tarball-files.txt
          grep -Fx "package/docs/setup.md" /tmp/openclaw-facebook-tarball-files.txt

      - name: Install tarball in isolated OpenClaw profile
        run: |
          tarball="${{ steps.pack.outputs.tarball }}"
          ./node_modules/.bin/openclaw --profile ci-facebook-clawhub-package plugins install "./$tarball" --force
          ./node_modules/.bin/openclaw --profile ci-facebook-clawhub-package plugins inspect facebook --json > /tmp/facebook-plugin-inspect.json
          ./node_modules/.bin/openclaw --profile ci-facebook-clawhub-package channels list --all --json > /tmp/openclaw-channels.json
          node -e "const fs=require('node:fs'); const inspect=JSON.parse(fs.readFileSync('/tmp/facebook-plugin-inspect.json','utf8')); if (inspect.diagnostics?.length) throw new Error(JSON.stringify(inspect.diagnostics)); if (!inspect.plugin?.channelIds?.includes('facebook')) throw new Error('facebook channel not loaded from plugin'); const channels=JSON.parse(fs.readFileSync('/tmp/openclaw-channels.json','utf8')).chat ?? {}; if (!channels.facebook?.installed) throw new Error('facebook is not installed in channel catalog'); if (channels.messenger) throw new Error('messenger appeared as a separate channel');"

      - name: Upload package artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: ${{ steps.pack.outputs.tarball_name }}
          path: ${{ steps.pack.outputs.tarball }}
          if-no-files-found: error

  clawhub-dry-run:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.publish == false)
    needs: package-artifact
    uses: openclaw/clawhub/.github/workflows/package-publish.yml@ecf09b868a986751137f4272283f84967a16c765 # v0.12.0
    with:
      dry_run: true
      source: ${{ github.event_name == 'pull_request' && format('{0}@{1}', github.event.pull_request.head.repo.full_name, github.event.pull_request.head.sha) || format('{0}@{1}', github.repository, github.sha) }}
      source_repo: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
      source_commit: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      source_ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}

  clawhub-publish-trusted:
    if: github.event_name == 'workflow_dispatch' && inputs.publish == true
    needs: package-artifact
    permissions:
      contents: read
      id-token: write
    uses: openclaw/clawhub/.github/workflows/package-publish.yml@ecf09b868a986751137f4272283f84967a16c765 # v0.12.0
    with:
      dry_run: false

  clawhub-publish-token:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: package-artifact
    permissions:
      contents: read
      id-token: write
    uses: openclaw/clawhub/.github/workflows/package-publish.yml@ecf09b868a986751137f4272283f84967a16c765 # v0.12.0
    with:
      dry_run: false
    secrets:
      clawhub_token: ${{ secrets.CLAWHUB_TOKEN }}
