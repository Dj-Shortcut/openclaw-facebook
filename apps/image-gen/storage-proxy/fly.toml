# Deployed Fly app: leaderbot-storage-proxy
# Do not deploy this project to the separate empty app named "storage-proxy".
app = "leaderbot-storage-proxy"
primary_region = 'ams'

[env]
  STORAGE_OPERATION_TIMEOUT_MS = "60000"
  # This public service is exposed only through Fly Proxy. Set false before
  # introducing a direct/private or alternate-proxy ingress path.
  STORAGE_TRUST_FLY_CLIENT_IP = "true"
  # STORAGE_RATE_LIMIT_REDIS_URL and STORAGE_RATE_LIMIT_KEY_SECRET are required
  # Fly secrets. Startup and /readyz fail closed when shared Redis is unavailable.
  # R2_LIFECYCLE_ACCESS_KEY_ID and R2_LIFECYCLE_SECRET_ACCESS_KEY must be a
  # separate Cloudflare R2 Admin Read only credential: account-wide bucket
  # listing/configuration, object read/list, and read-only Data Catalog
  # table/metadata access. The proxy uses it only for one lifecycle read per
  # startup and never uses Data Catalog; provider scope cannot be inferred here.
  # The object credential stays bucket-scoped Object Read & Write. Never deploy
  # Admin Read & Write.
  # Phase 1 bridge: the currently running image-gen release still sends only
  # bearer auth and uses unscoped historical keys. Remove bearer auth only
  # after every image-gen Machine is on signed requests; retain legacy keys
  # until the 30-day lifecycle window and inventory migration are complete.
  STORAGE_ALLOW_LEGACY_BEARER_AUTH = "true"
  STORAGE_ALLOW_LEGACY_KEYS = "true"

[processes]
  app = "node dist/index.cjs"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "60s"
    method = "GET"
    path = "/healthz"
